<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=user-scalable=no, initial-scale=1.0">
    <title>🏥 KHHB-2 GÖREN ANALİZ - Gelişmiş BI Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root { 
            --sidebar-bg: #0f172a; 
            --sidebar-hover: #1e293b;
            --accent: #10b981; 
            --accent-hover: #059669;
            --bg: #f8fafc; 
            --text-main: #334155;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }
        
        body { 
            background: var(--bg); 
            font-family: 'Inter', sans-serif; 
            color: var(--text-main);
            margin: 0; 
            overflow: hidden; 
        }
        
        .app-wrapper { display: flex; height: 100vh; }
        
        /* Sol Menü Tasarımı */
        .sidebar { 
            width: 280px; 
            background: var(--sidebar-bg); 
            color: #f1f5f9; 
            flex-shrink: 0; 
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 24px rgba(0,0,0,0.1);
        }
        
        .sidebar-brand {
            padding: 24px;
            border-bottom: 1px solid #1e293b;
            background: #020617;
        }
        
        .nav-container { flex-grow: 1; padding: 15px 0; overflow-y: auto; }
        
        .nav-item { 
            padding: 12px 24px; 
            color: #94a3b8; 
            cursor: pointer; 
            border-left: 4px solid transparent; 
            transition: all 0.2s ease-in-out; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            font-weight: 500;
            font-size: 14px;
        }
        
        .nav-item i { font-size: 18px; transition: color 0.2s; }
        
        .nav-item:hover, .nav-item.active { 
            background: var(--sidebar-hover); 
            color: #fff; 
            border-left-color: var(--accent); 
        }
        
        .nav-item:hover i, .nav-item.active i { color: var(--accent); }
        
        /* Sağ İçerik Alanı */
        .main-content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; height: 100vh; }
        
        .top-header { 
            background: white; 
            padding: 18px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        
        /* Yapışkan Gelişmiş Filtre Çubuğu */
        .filter-bar { 
            background: #fff; 
            padding: 16px 30px; 
            display: none; 
            gap: 16px; 
            border-bottom: 1px solid #e2e8f0; 
            align-items: flex-end; 
            flex-wrap: wrap; 
            position: sticky; 
            top: 0; 
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }
        
        .filter-group { display: flex; flex-direction: column; min-width: 150px; flex: 1; }
        .filter-group label { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .filter-group select, .filter-group input { padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px; background: #f8fafc; width: 100%; transition: border 0.2s; }
        .filter-group select:focus, .filter-group input:focus { outline: none; border-color: var(--accent); background: #fff; }
        
        .btn-sm-custom { 
            padding: 11px 24px; 
            font-size: 13px; 
            font-weight: 600;
            border-radius: 8px; 
            background: var(--accent); 
            border: none; 
            color: white; 
            cursor: pointer; 
            transition: background 0.2s; 
            white-space: nowrap; 
        }
        .btn-sm-custom:hover { background: var(--accent-hover); }
        
        .page-padding { padding: 30px; }
        .page { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page.active { display: block; }
        
        /* Modern Kart Yapısı */
        .kds-card { 
            background: white; 
            border-radius: 16px; 
            padding: 24px; 
            box-shadow: var(--card-shadow); 
            border: 1px solid #e2e8f0;
            height: 100%; 
            position: relative;
            overflow: hidden;
        }
        .kds-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent); }
        
        .stat-val { font-size: 2.4rem; font-weight: 800; color: #1e293b; margin-top: 8px; }
        
        /* Rozetler ve Butonlar */
        .itiraz-btn { background: #f59e0b; border: none; color: white; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .itiraz-btn:hover { background: #d97706; }
        
        .badge-muaf { background: #f1f5f9; color: #64748b; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-basarili { background: #dcfce7; color: #15803d; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-kritik { background: #fee2e2; color: #b91c1c; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-orta { background: #fef3c7; color: #b45309; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-itiraz-var { background: #ffedd5; color: #c2410c; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-left: 6px; border: 1px solid #fed7aa; }
        
        /* Sıralama Listeleri */
        .rank-card { 
            background: #f8fafc; 
            border-radius: 12px; 
            padding: 14px 18px; 
            margin-bottom: 10px; 
            border: 1px solid #e2e8f0;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            transition: transform 0.2s;
        }
        .rank-card:hover { transform: translateY(-2px); }
        .rank-number { width: 28px; height: 28px; background: var(--sidebar-bg); color: white; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; margin-right: 12px; }
        
        .chart-container { position: relative; height: 340px; margin-top: 20px; }
        
        /* Modal Katmanı */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index:1000; align-items:center; justify-content:center; }
        .modal-overlay.active { display: flex; }
        .modal-container { background: white; width: 650px; max-width:92%; max-height:85vh; overflow-y:auto; border-radius:16px; padding:28px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 1px solid #e2e8f0; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 14px; margin-bottom: 20px; }
        .modal-close { background: none; border: none; font-size: 24px; color: #94a3b8; cursor: pointer; }
        .modal-close:hover { color: #334155; }
        
        .gosterge-detay { padding: 12px 16px; background: #f8fafc; border-radius: 8px; margin-bottom: 10px; border: 1px solid #e2e8f0; font-size: 14px; }
        
        .donem-checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; margin: 20px 0; padding: 16px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
        .progress-bar { width: 100%; background: #e2e8f0; border-radius: 10px; height: 8px; overflow: hidden; margin-top: 4px; }
        .progress-fill { height: 100%; border-radius: 10px; transition: width 0.5s ease-in-out; }
        .loading { text-align: center; padding: 40px; color: #64748b; font-weight: 500; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand text-center">
            <h6 class="fw-bold mb-0 text-white tracking-wide"><i class="bi bi-building-fill-gear text-success"></i> KHHB-2 GÖREN ANALİZ</h6>
        </div>
        <nav class="nav-container">
            <div class="nav-item active" data-page="genel-bakis"><i class="bi bi-pie-chart-fill"></i> Genel Bakış</div>
            <div class="nav-item" data-page="tum-bolge"><i class="bi bi-globe2"></i> Tüm Bölge Sıralaması</div>
            <div class="nav-item" data-page="kurum-bazli"><i class="bi bi-hospital-fill"></i> Kurum Bazlı Analiz</div>
            <div class="nav-item" data-page="karsilastirma"><i class="bi bi-arrow-left-right"></i> Dönemsel Karşılaştırma</div>
            <div class="nav-item" data-page="raporlar"><i class="bi bi-graph-up-arrow"></i> Gelişmiş Raporlar</div>
            <div class="nav-item" data-page="itirazlar"><i class="bi bi-envelope-exclamation-fill"></i> İtiraz Yönetimi</div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h5 id="page-title" class="mb-0 fw-bold text-slate-800">Genel Bakış</h5>
            <div class="badge bg-emerald-500 px-3 py-2 rounded-pill font-semibold" style="background-color: #10b981"><i class="bi bi-broadcast"></i> Veri Tabanı Canlı</div>
        </header>
        
        <div id="filter-bar" class="filter-bar">
            <div class="filter-group"><label>Yıl</label><select id="f-yil"></select></div>
            <div class="filter-group"><label>Dönem</label><select id="f-donem"></select></div>
            <div class="filter-group"><label>Kurum Türü</label><select id="f-tip"><option value="">Tümü</option><option value="Hastane">Hastane</option><option value="ADSM">ADSM/ADSH</option></select></div>
            <div class="filter-group"><label>Kurum Adı</label><select id="f-kurum"><option value="">Seçiniz</option></select></div>
            <button class="btn-sm-custom" id="kurumSorgulaBtn"><i class="bi bi-search"></i> Sorgula</button>
        </div>

        <div class="page-padding">
            <section id="genel-bakis" class="page active">...</section>
            
            <section id="tum-bolge" class="page">...</section>
            
            <section id="kurum-bazli" class="page">
                <div id="kurumAnalizIcerik" class="kds-card">Sol üstteki filtre alanından kurum seçip sorgulama yapabilirsiniz.</div>
            </section>
            
            <section id="karsilastirma" class="page">...</section>
            
            <section id="raporlar" class="page">...</section>
            
            <section id="itirazlar" class="page">...</section>
        </div>
    </main>
</div>

<div id="gostergeModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h5 id="modalBaslik" class="fw-bold text-slate-900">Gösterge Detayı</h5>
            <button class="modal-close" onclick="window.kapatModal()">&times;</button>
        </div>
        <div id="modalIcerik"></div>
    </div>
</div>

<script>
    // ---------- SUPABASE BAĞLANTISI ----------
    const SUPABASE_URL = "https://alisjxtoivkeyeyyuikr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_dToCJocokZ1QVw8-oHTe6Q_72u3p7Of";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---------- GLOBAL PROPERTILER & AYARLAR ----------
    let charts = {};
    let itirazPerformansMap = {};
    let mevcutYillarDonemler = { yillar: [], donemler: [] };
    const AYLAR = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

    const formatDonemAdi = (donem) => AYLAR[donem-1] || `${donem}. Dönem`;
    const showLoading = (elementId, mesaj = "Veriler yükleniyor...") => { 
        const el = document.getElementById(elementId); 
        if(el) el.innerHTML = `<div class="loading"><div class="spinner-border spinner-border-sm text-success me-2"></div>${mesaj}</div>`; 
    };
    
    // ---------- VERİ TABANI YARDIMCILARI ----------
    async function fetchData(table, select, filters = {}) {
        try {
            let query = _supabase.from(table).select(select);
            Object.entries(filters).forEach(([key, val]) => { 
                if(val !== undefined && val !== null && val !== '') query = query.eq(key, val); 
            });
            const { data, error } = await query;
            if(error) throw error;
            return data;
        } catch(err) { 
            console.error(`fetchData Hatası (${table}):`, err); 
            return null; 
        }
    }

    async function itirazDurumlariniYukle() {
        const data = await fetchData('itirazlar', 'performans_id');
        itirazPerformansMap = {};
        data?.forEach(i => { itirazPerformansMap[i.performans_id] = true; });
    }

    // Göstergelerin dinamik durum değerlendirmesi
    function degerlendir(gd, trOrt, yon, puan, gp, performansId = null) {
        let itirazBadge = (performansId && itirazPerformansMap[performansId]) ? '<span class="badge-itiraz-var">📝 İtiraz Yapıldı</span>' : '';
        if (gd === null || gd === undefined || trOrt === null || trOrt === undefined) 
            return { class: 'badge-muaf', text: '🔘 Muaf' + itirazBadge };
        const ilOrtBasari = yon === 'Pozitif' ? gd >= trOrt : gd <= trOrt;
        const puanOrani = (puan / gp) * 100;
        if (ilOrtBasari && puanOrani >= 75) return { class: 'badge-basarili', text: '✅ Mükemmel' + itirazBadge };
        if (ilOrtBasari && puanOrani >= 50) return { class: 'badge-basarili', text: '✅ Başarılı' + itirazBadge };
        if (!ilOrtBasari && puanOrani >= 50) return { class: 'badge-orta', text: '⚠️ Gelişmeli' + itirazBadge };
        return { class: 'badge-kritik', text: '❌ Kritik' + itirazBadge };
    }

    function yonOku(yon) {
        return yon === 'Pozitif' ? '<span class="text-success fw-bold">↑ Pozitif</span>' : '<span class="text-danger fw-bold">↓ Negatif</span>';
    }

    function pdfUrlGetir(gostergeKodu) {
        if(!gostergeKodu) return null;
        if(gostergeKodu.startsWith('SYPG-BH-')) {
            let numara = gostergeKodu.split('-')[2];
            return `https://raw.githubusercontent.com/ahmtylmz3441-sys/kds-performans-kuzey/pendikismdenetim/dokumanlar/h${numara}.pdf`;
        }
        if(gostergeKodu.startsWith('SYPG-ADSH-')) {
            let numara = gostergeKodu.split('-')[2];
            return `https://raw.githubusercontent.com/ahmtylmz3441-sys/kds-performans-kuzey/pendikismdenetim/dokumanlar/a${numara}.pdf`;
        }
        return null;
    }

    // ---------- MODAL YÖNETİMİ ----------
    window.gostergeDetayGoster = function(id, ad, gd, trOrt, puan, gp, yon, gostergeKodu, kurumTipi) {
        document.getElementById('modalBaslik').innerHTML = `📊 ${gostergeKodu} - ${ad}`;
        const yonTuru = yon === 'Pozitif' ? '↑ Pozitif (Yüksek olması hedeflenir)' : '↓ Negatif (Düşük olması hedeflenir)';
        let html = `
            <div class="gosterge-detay"><strong>🎯 Hedef Yönü:</strong> ${yonTuru}</div>
            <div class="gosterge-detay"><strong>📈 Gösterge Değeri (GD):</strong> ${gd ?? '-'}</div>
            <div class="gosterge-detay"><strong>📊 TR Ortalaması:</strong> ${trOrt ?? '-'}</div>
            <div class="gosterge-detay"><strong>⭐ Alınan Puan / GP:</strong> ${puan ?? '0'}/${gp ?? '-'}</div>`;
        
        if(itirazPerformansMap[id]) html += `<div class="gosterge-detay" style="background:#fff7ed; border-color:#fed7aa;"><strong class="text-warning">📝 İtiraz Durumu:</strong> İtiraz değerlendirme sürecindedir.</div>`;
        else html += `<div class="gosterge-detay"><strong>📝 İtiraz Durumu:</strong> Bu dönem için yapılmış aktif itiraz bulunmamaktadır.</div>`;
        
        const pdfUrl = pdfUrlGetir(gostergeKodu);
        if(pdfUrl) {
            const viewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(pdfUrl)}&embedded=true`;
            html += `
                <div class="gosterge-detay mt-3"><strong>📄 Gösterge Dokümanı Kılavuzu:</strong>
                    <iframe src="${viewerUrl}" class="pdf-iframe mt-2" style="width:100%; height:320px; border:1px solid #cbd5e1; border-radius:8px;"></iframe>
                    <div class="text-end mt-2"><a href="${pdfUrl}" target="_blank" class="btn btn-sm btn-outline-primary"><i class="bi bi-box-arrow-up-right"></i> Tam Ekran PDF Aç</a></div>
                </div>`;
        }
        document.getElementById('modalIcerik').innerHTML = html;
        document.getElementById('gostergeModal').classList.add('active');
    };
    window.kapatModal = () => document.getElementById('gostergeModal').classList.remove('active');

    // ---------- FİLTRELERİ DOLDURMA ----------
    async function dinamikFiltreleriDoldur() {
        const { data: donemlerData } = await _supabase.from('toplam_puanlar').select('donem, yil');
        if(!donemlerData) return;
        const yillar = [...new Set(donemlerData.map(d => d.yil).filter(y => y))].sort((a,b)=>b-a);
        const donemler = [...new Set(donemlerData.map(d => d.donem).filter(d => d))].sort((a,b)=>a-b);
        
        const yilSelect = document.getElementById('f-yil');
        if(yilSelect) yilSelect.innerHTML = yillar.map(y => `<option value="${y}">${y}</option>`).join('');
        
        const donemSelect = document.getElementById('f-donem');
        if(donemSelect) donemSelect.innerHTML = donemler.map(d => `<option value="${d}">${formatDonemAdi(d)}</option>`).join('');
        
        mevcutYillarDonemler = { yillar, donemler };
    }

    // ---------- SAYFA: GENEL BAKIŞ ----------
    async function dashboard() {
        showLoading('genel-bakis', 'Gösterge paneli güncelleniyor...');
        const seciliYil = document.getElementById('f-yil')?.value || '2026';
        const seciliDonem = document.getElementById('f-donem')?.value || '2';
        
        const { data } = await fetchData('toplam_puanlar', '*', { yil: seciliYil, donem: seciliDonem });
        if(!data?.length) { 
            document.getElementById('genel-bakis').innerHTML = '<div class="kds-card"><div class="alert alert-warning mb-0">Seçili dönem ve yıla ait toplam puan verisi bulunamadı.</div></div>'; 
            return; 
        }
        
        const hastane = data.filter(x => x.kurum_tipi === 'Hastane');
        const adsm = data.filter(x => x.kurum_tipi === 'ADSM');
        
        const hOrt = (hastane.reduce((s,v)=>s+v.toplam_puan,0)/(hastane.length||1)).toFixed(1);
        const aOrt = (adsm.reduce((s,v)=>s+v.toplam_puan,0)/(adsm.length||1)).toFixed(1);
        
        const topH = [...hastane].sort((a,b)=>b.toplam_puan - a.toplam_puan).slice(0,5);
        const topA = [...adsm].sort((a,b)=>b.toplam_puan - a.toplam_puan).slice(0,5);
        
        let htmlDashboard = `
            <div class="row g-4 mb-4">
                <div class="col-md-4"><div class="kds-card"><h6><i class="bi bi-buildings text-primary"></i> Toplam Kurum</h6><div class="stat-val" id="s-toplam">${data.length}</div></div></div>
                <div class="col-md-4"><div class="kds-card"><h6><i class="bi bi-hospital text-success"></i> Hastane Puan Ortalaması</h6><div class="stat-val text-success" id="s-h-ort">${hOrt}</div></div></div>
                <div class="col-md-4"><div class="kds-card"><h6><i class="bi bi-activity text-info"></i> ADSM/ADSH Puan Ortalaması</h6><div class="stat-val text-info" id="s-a-ort">${aOrt}</div></div></div>
            </div>
            <div class="row g-4">
                <div class="col-md-6"><div class="kds-card"><h6>🏆 En Yüksek Puanlı 5 Hastane</h6><div id="top-hastane" class="mt-3"></div></div></div>
                <div class="col-md-6"><div class="kds-card"><h6>🏆 En Yüksek Puanlı 5 ADSM/ADSH</h6><div id="top-adsm" class="mt-3"></div></div></div>
            </div>`;
            
        document.getElementById('genel-bakis').innerHTML = htmlDashboard;
        
        document.getElementById('top-hastane').innerHTML = topH.map((k,i)=>`<div class="rank-card"><div><span class="rank-number">${i+1}</span> <strong>${k.kurum_adi}</strong></div><span class="text-success fw-bold">${k.toplam_puan} Puan</span></div>`).join('');
        document.getElementById('top-adsm').innerHTML = topA.map((k,i)=>`<div class="rank-card"><div><span class="rank-number">${i+1}</span> <strong>${k.kurum_adi}</strong></div><span class="text-success fw-bold">${k.toplam_puan} Puan</span></div>`).join('');
    }

    // ---------- SAYFA: TÜM BÖLGE SIRALAMASI ----------
    window.bolgeListesi = async function() {
        const seciliYil = document.getElementById('f-yil')?.value || '2026';
        const seciliDonem = document.getElementById('f-donem')?.value || '2';
        let tip = document.getElementById('bolgeFiltreTip')?.value || '';
        
        let query = _supabase.from('toplam_puanlar').select('*').eq('yil', seciliYil).eq('donem', seciliDonem);
        if(tip) query = query.eq('kurum_tipi', tip);
        
        const { data, error } = await query.order('toplam_puan', { ascending: false });
        const tbody = document.querySelector('#table-bolge tbody');
        if(!tbody) return;
        
        if(error || !data?.length) { 
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Kayıtlı veri bulunamadı.</td></tr>`; 
            return; 
        }
        
        tbody.innerHTML = data.map(d => {
            const basariDurumu = parseFloat(d.toplam_puan) >= parseFloat(d.rol_ortalamasi) 
                ? '<span class="badge-basarili"><i class="bi bi-check-circle-fill"></i> Ortalamanın Üstünde</span>' 
                : '<span class="badge-kritik"><i class="bi bi-exclamation-triangle-fill"></i> Ortalamanın Altında</span>';

    // ---------- SAYFA: KURUM BAZLI DETAY ----------
    window.kurumAnaliz = async function() {
        const kurum = document.getElementById('f-kurum').value;
        const yil = document.getElementById('f-yil').value;
        const donem = document.getElementById('f-donem').value;
        if(!kurum) { alert('Lütfen listeden analiz etmek istediğiniz kurumu seçin.'); return; }
        
        showLoading('kurumAnalizIcerik', `${kurum} verileri işleniyor...`);
        await itirazDurumlariniYukle();
        
        const { data: perfRaw } = await _supabase.from('performans').select('*').eq('kurum_adi', kurum).eq('yil', yil).eq('donem', donem);
        if(!perfRaw?.length) { 
            document.getElementById('kurumAnalizIcerik').innerHTML = `<div class="alert alert-warning m-2">Bu kurumun seçilen döneme ait performans gösterge datası bulunamadı.</div>`; 
            return; 
        }
        
        const perf = perfRaw.sort((a,b) => parseInt(a.gosterge_kodu.split('-')[2]) - parseInt(b.gosterge_kodu.split('-')[2]));
        const { data: toplam } = await _supabase.from('toplam_puanlar').select('toplam_puan,rol_ortalamasi').eq('kurum_adi', kurum).eq('yil', yil).eq('donem', donem).maybeSingle();
        
        let html = `<h5 class="fw-bold text-dark mb-3"><i class="bi bi-hospital"></i> ${kurum} Performans Detayları</h5>`;
        if(toplam) {
            html += `
                <div class="row g-3 mb-4">
                    <div class="col-md-6"><div class="p-3 bg-light rounded border border-start border-success border-4">🏆 Toplam Skor: <strong class="fs-5 text-success">${toplam.toplam_puan}</strong></div></div>
                    <div class="col-md-6"><div class="p-3 bg-light rounded border border-start border-primary border-4">📊 Rol Grubu Ortalaması: <strong class="fs-5 text-primary">${toplam.rol_ortalamasi}</strong></div></div>
                </div>`;
        }
        
        html += `
            <div class="table-responsive">
                <table class="table table-hover align-middle table-striped border">
                    <thead class="table-dark">
                        <tr>
                            <th>Kodu / Gösterge Adı</th><th>Yön</th><th>GD</th><th>TR Ort</th><th>Puan/GP</th><th>Değerlendirme</th><th>Aksiyon</th>
                        </tr>
                    </thead>
                    <tbody>`;
                    
        for(const r of perf) {
            const durum = degerlendir(r.gd, r.tr_ort, r.gosterge_yonu, r.puan, r.gp, r.id);
            const temizGostergeAdi = r.gosterge_adi.replace(/'/g, "\\'");
            html += `<tr>
                <td><a href="#" class="text-decoration-none fw-semibold text-primary" onclick="window.gostergeDetayGoster('${r.id}','${temizGostergeAdi}', '${r.gd}', '${r.tr_ort}', '${r.puan}', '${r.gp}', '${r.gosterge_yonu}', '${r.gosterge_kodu}', '${r.kurum_tipi}'); return false;"><i class="bi bi-info-circle-fill text-muted me-1"></i> [${r.gosterge_kodu}] ${r.gosterge_adi}</a></td>
                <td>${yonOku(r.gosterge_yonu)}</td>
                <td class="fw-bold">${r.gd ?? '-'}</td>
                <td>${r.tr_ort ?? '-'}</td>
                <td class="text-secondary font-monospace">${r.puan ?? 'null'}/${r.gp}</td>
                <td><span class="${durum.class}">${durum.text}</span></td>
                <td><button class="itiraz-btn" onclick="window.itirazEkle('${r.id}','${kurum.replace(/'/g, "\\'")}','${temizGostergeAdi}',${r.yil},${r.donem})"><i class="bi bi-pencil-square"></i> İtiraz</button></td>
            </tr>`;
        }
        html += `</tbody></table></div>`;
        document.getElementById('kurumAnalizIcerik').innerHTML = html;
    };

    // ---------- SAYFA: İTİRAZ YÖNETİMİ ----------
    window.itirazEkle = async function(pid, kurum, gosterge, yil, donem) {
        const metin = prompt(`${kurum}\n${gosterge}\n${yil}/${donem} Dönemi\nLütfen gerekçeli itiraz nedeninizi yazınız:`);
        if(!metin) return;
        const { error } = await _supabase.from('itirazlar').insert({ performans_id: pid, itiraz_metni: metin, durum: 'beklemede' });
        alert(error ? "Hata oluştu: " + error.message : "✅ İtirazınız başarıyla kayıt altına alındı.");
        if(!error) { 
            await itirazDurumlariniYukle(); 
            if(document.getElementById('kurum-bazli').classList.contains('active')) window.kurumAnaliz();
        }
    };

        window.itirazlariGoster();

    window.itirazSil = async function(id) {

            const sonuc = {};
            data?.forEach(r => { 
                if(!sonuc[r.kurum_adi]) sonuc[r.kurum_adi] = {}; 
                sonuc[r.kurum_adi][`d${r.donem}`] = r.gd; 
            });
            
            const labels = Object.keys(sonuc).slice(0,10);
            const ocakData = labels.map(l=>sonuc[l]?.d1 || null);
            const subatData = labels.map(l=>sonuc[l]?.d2 || null);
            
            if(charts.gosterge) charts.gosterge.destroy();

                    labels,

            });
        };
        await gelismeAnaliziniYukle();

    }

    async function gelismeAnaliziniYukle() {
        const { data: ocak } = await _supabase.from('performans').select('kurum_adi, gosterge_adi, gd').eq('donem',1);
        const { data: subat } = await _supabase.from('performans').select('kurum_adi, gosterge_adi, gd').eq('donem',2);
        
        const ocakMap = Object.fromEntries((ocak||[]).map(r => [`${r.kurum_adi}|${r.gosterge_adi}`, parseFloat(r.gd)]));
        const degisimler = [];
        
        (subat||[]).forEach(r => {
            const ocakGd = ocakMap[`${r.kurum_adi}|${r.gosterge_adi}`];
            if(ocakGd !== undefined && r.gd !== null) {
                const fark = parseFloat(r.gd) - ocakGd;
                degisimler.push({ 
                    kurum: r.kurum_adi, 
                    gosterge: r.gosterge_adi, 
                    ocak: ocakGd, 
                    subat: parseFloat(r.gd), 
                    fark: fark.toFixed(2), 
                    yuzde: ocakGd!==0 ? ((fark/ocakGd)*100).toFixed(1) : 0 
                });
            }
        });
        
        const gelisen = degisimler.filter(d=>d.fark>0).sort((a,b)=>b.fark - a.fark).slice(0,5);
        const gerileyen = degisimler.filter(d=>d.fark<0).sort((a,b)=>a.fark - b.fark).slice(0,5);
        
        document.getElementById('gelisenGostergeler').innerHTML = gelisen.map(g=>`<div class="rank-card"><div><strong>${g.kurum.substring(0,25)}...</strong><br><small class="text-muted">${g.gosterge.substring(0,35)}...</small></div><div><span class="badge bg-success-subtle text-success">${g.ocak}→${g.subat}</span> <span class="text-success fw-bold">+${g.fark}</span></div></div>`).join('');
        document.getElementById('gerileyenGostergeler').innerHTML = gerileyen.map(g=>`<div class="rank-card"><div><strong>${g.kurum.substring(0,25)}...</strong><br><small class="text-muted">${g.gosterge.substring(0,35)}...</small></div><div><span class="badge bg-danger-subtle text-danger">${g.ocak}→${g.subat}</span> <span class="text-danger fw-bold">${g.fark}</span></div></div>`).join('');
    }

    async function kritikAnaliziniYukle() {
        const { data } = await _supabase.from('performans').select('kurum_adi, gd, tr_ort, gosterge_yonu, puan, gp').eq('donem',2);
        if(!data?.length) return;
        const kurumKritik = {}, kurumToplam = {};
        
        data.forEach(r => {
            kurumToplam[r.kurum_adi] = (kurumToplam[r.kurum_adi]||0)+1;
            if(r.gd !== null && r.tr_ort !== null) {
                const ilOrtBasari = r.gosterge_yonu === 'Pozitif' ? r.gd >= r.tr_ort : r.gd <= r.tr_ort;
                const puanOrani = (r.puan / r.gp) * 100;
                if(!ilOrtBasari && puanOrani < 50) kurumKritik[r.kurum_adi] = (kurumKritik[r.kurum_adi]||0)+1;
            }
        });
        
        const sirali = Object.entries(kurumToplam).map(([k, total]) => {
            const kritikSayisi = kurumKritik[k] || 0;
            return { kurum: k, kritik: kritikSayisi, toplam: total, oran: ((kritikSayisi/total)*100).toFixed(1) };
        }).sort((a,b)=>b.kritik - a.kritik);
        
        const tbody = document.querySelector('#kritikTablo tbody');
        if(tbody) tbody.innerHTML = sirali.map((k,i)=>`<tr><td>${i+1}</td><td><b>${k.kurum}</b></td><td class="text-danger fw-bold">${k.kritik}</td><td>${k.toplam}</td><td><div class="progress-bar"><div class="progress-fill bg-danger" style="width:${k.oran}%"></div></div><small class="fw-bold">${k.oran}%</small></td></tr>`).join('');
    }

    window.karsilastirmaDonemListesiGuncelle = async function() {
        const kurum = document.getElementById('karsKurumAdi').value;
        if(!kurum) { document.getElementById('karsDonemCheckboxlar').innerHTML = ''; return; }
        const { data } = await _supabase.from('toplam_puanlar').select('donem').eq('kurum_adi', kurum).order('donem');
        const donemler = [...new Set((data||[]).map(d=>d.donem))].sort((a,b)=>a-b);

            html += `<label class="me-3 p-2 bg-white rounded border cursor-pointer"><input type="checkbox" class="donem-checkbox form-check-input me-1" value="${d}"> ${formatDonemAdi(d)}</label>`;
        });
        document.getElementById('karsDonemCheckboxlar').innerHTML = html;
    };

    window.donemselKarsilastir = async function() {
        const kurum = document.getElementById('karsKurumAdi').value;
        const seciliDonemler = Array.from(document.querySelectorAll('.donem-checkbox:checked')).map(cb=>parseInt(cb.value)).sort((a,b)=>a-b);
        if(!kurum || seciliDonemler.length===0) { alert('Lütfen bir kurum ve en az bir dönem seçimi yapın.'); return; }
        if(seciliDonemler.length>4) { alert('Verimli analiz için en fazla 4 dönem seçebilirsiniz.'); return; }
        
        showLoading('karsilastirmaSonuc', 'Dönemsel karşılaştırma matrisi hazırlanıyor...');
        
        const toplamlar = {};
        for(let d of seciliDonemler) {
            const { data } = await _supabase.from('toplam_puanlar').select('toplam_puan, rol_ortalamasi').eq('kurum_adi', kurum).eq('donem', d).maybeSingle();
            toplamlar[d] = data || { toplam_puan: '-', rol_ortalamasi: '-' };
        }
        
        const { data: tumGostergeler } = await _supabase.from('performans').select('gosterge_kodu, gosterge_adi, gosterge_yonu, donem, gd, tr_ort').eq('kurum_adi', kurum).in('donem', seciliDonemler);
        const gostergeMap = new Map();
        tumGostergeler?.forEach(g => { 
            if(!gostergeMap.has(g.gosterge_kodu)) gostergeMap.set(g.gosterge_kodu, { kod: g.gosterge_kodu, ad: g.gosterge_adi, yon: g.gosterge_yonu }); 
        });
        const gostergeler = Array.from(gostergeMap.values()).sort((a,b)=>parseInt(a.kod.split('-')[2]) - parseInt(b.kod.split('-')[2]));
        
        const gostergeDegerler = {};
        tumGostergeler?.forEach(g => { gostergeDegerler[`${g.gosterge_kodu}_${g.donem}`] = { gd: g.gd, tr_ort: g.tr_ort }; });
        
        let html = `
            <div class="table-responsive mt-3">
                <table class="table table-bordered align-middle bg-white">
                    <thead class="table-dark">
                        <tr><th>Takip Edilen Gösterge Parametresi</th>${seciliDonemler.map(d=>`<th>${formatDonemAdi(d)} (GD / TR)</th>`).join('')}</tr>
                    </thead>
                    <tbody>
                    <tr class="table-success fw-bold"><td>🏆 TOPLAM KALİTE PUANI</td>${seciliDonemler.map(d=>`<td class="text-success fs-5">${toplamlar[d].toplam_puan}</td>`).join('')}</tr>
                    <tr class="table-info fw-bold"><td>📊 GRUP ROL ORTALAMASI</td>${seciliDonemler.map(d=>`<td class="text-primary">${toplamlar[d].rol_ortalamasi}</td>`).join('')}</tr>`;
                    
        for(let g of gostergeler) {
            html += `<tr><td><strong>[${g.kod}]</strong> ${g.ad.substring(0,55)}...</td>`;
            for(let d of seciliDonemler) {
                const val = gostergeDegerler[`${g.kod}_${d}`];
                html += `<td>${val && val.gd!==null ? `<span class="fw-bold text-dark">${val.gd}</span> <span class="text-muted">/ ${val.tr_ort}</span>` : '- / -'}</td>`;
            }
            html += `</tr>`;
        }
        html += `</tbody></table></div>`;
        
        const puanlar = seciliDonemler.map(d => toplamlar[d].toplam_puan !== '-' ? toplamlar[d].toplam_puan : 0);
        const canvasId = 'karsilastirmaChart';
        html += `<div class="mt-4 p-3 bg-light rounded border"><h6>📊 Toplam Puan Dönemsel İlerleme Çizgisi</h6><div style="height:230px;"><canvas id="${canvasId}"></canvas></div></div>`;
        
        document.getElementById('karsilastirmaSonuc').innerHTML = html;
        
        if(window.karsChart) window.karsChart.destroy();
        const ctx = document.getElementById(canvasId)?.getContext('2d');
        if(ctx) {
            window.karsChart = new Chart(ctx, { 
                type: 'line', 
                data: { 
                    labels: seciliDonemler.map(d=>formatDonemAdi(d)), 
                    datasets: [{ label: 'Kurum Skoru', data: puanlar, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', tension: 0.3, fill: true, borderWidth: 3 }] 
                }, 
                options: { responsive: true, maintainAspectRatio: false } 
            });
        }
    };

                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover table-striped align-middle border" id="table-bolge">
                            <thead class="table-dark"><tr><th>Kurum Kurumsal Adı</th><th>Türü</th><th>Toplam Puan</th><th>Rol Ortalaması</th><th>Genel Durum</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>

            document.getElementById('bolgeFiltreTip').onchange = () => window.bolgeListesi();

        if(sayfa === 'raporlar') await raporlar();
        if(sayfa === 'itirazlar') {
            document.getElementById('itirazlar').innerHTML = `<div class="kds-card"><h6><i class="bi bi-envelope-paper"></i> Kalite Puanlama İtiraz Yönetim Merkezi</h6><div id="itirazListe" class="mt-3"></div></div>`;
            await window.itirazlariGoster();
        }
        if(sayfa === 'karsilastirma') {
            document.getElementById('karsilastirma').innerHTML = `
                <div class="kds-card">
                    <h6><i class="bi bi-calendar-range-fill text-success"></i> Kurum Bazlı Dönemsel Trend Karşılaştırması</h6>
                    <div class="row g-3 mt-1">
                        <div class="col-md-4"><label class="small fw-bold text-muted">Kurum Türü</label><select id="karsKurumTip" class="form-select"><option value="">Tümü</option><option value="Hastane">Hastane</option><option value="ADSM">ADSM/ADSH</option></select></div>
                        <div class="col-md-5"><label class="small fw-bold text-muted">Kurum Adı</label><select id="karsKurumAdi" class="form-select"><option value="">Önce tür seçiniz</option></select></div>
                    </div>
                    <div id="karsDonemCheckboxlar" class="donem-checkbox-group row mx-0"></div>
                    <button class="btn-sm-custom mt-2" id="karsilastirBtn"><i class="bi bi-arrow-left-right"></i> Matrisi Hesapla ve Karşılaştır</button>
                    <div id="karsilastirmaSonuc" class="mt-3"></div>
                </div>`;
            document.getElementById('karsKurumTip').onchange = () => window.karsilastirmaKurumListesiGuncelle();
            document.getElementById('karsKurumAdi').onchange = () => window.karsilastirmaDonemListesiGuncelle();
            document.getElementById('karsilastirBtn').onclick = () => window.donemselKarsilastir();
            await window.karsilastirmaKurumListesiGuncelle();
        }
    };

    // ---------- PANALİZ BAŞLATMA TETİKLEYİCİSİ ----------
    document.addEventListener("DOMContentLoaded", async () => {
        await dinamikFiltreleriDoldur();
        await itirazDurumlariniYukle();
        
        // Üst ana kurum tipi değiştiğinde kurum adlarını getir
        document.getElementById('f-tip').onchange = async () => {
            const tip = document.getElementById('f-tip').value;
            let q = _supabase.from('toplam_puanlar').select('kurum_adi');
            if(tip) q = q.eq('kurum_tipi', tip);
            const { data } = await q;
            const tekil = [...new Set((data||[]).map(d=>d.kurum_adi))].sort();
            document.getElementById('f-kurum').innerHTML = '<option value="">Kurum Seçiniz</option>' + tekil.map(k=>`<option value="${k}">${k}</option>`).join('');
        };
        
        document.getElementById('kurumSorgulaBtn').onclick = () => window.kurumAnaliz();
        
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const sayfa = item.getAttribute('data-page');
                if(sayfa) window.gitSayfa(sayfa, item);
            });
        });
        
        // İlk açılışta dashboard'u yükle
        await window.gitSayfa('genel-bakis', document.querySelector('.nav-item[data-page="genel-bakis"]'));
    });
</script>
</body>
</html>
