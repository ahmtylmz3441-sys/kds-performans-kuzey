<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS - Kurumsal Değerlendirme Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ========== GELİŞMİŞ STİLLER ========== */
        :root {
            --sidebar-bg: #0a1a2f;
            --accent: #2dd4bf;
            --bg: #f0f4f8;
            --card-shadow: 0 8px 20px rgba(0,0,0,0.05);
            --transition: all 0.2s ease;
        }
        body { background: var(--bg); font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; overflow: hidden; }
        .app-wrapper { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: var(--sidebar-bg); color: #e2e8f0; flex-shrink: 0; overflow-y: auto; box-shadow: 2px 0 12px rgba(0,0,0,0.05); z-index: 10; }
        .sidebar .nav-item { padding: 12px 20px; margin: 4px 12px; border-radius: 12px; transition: var(--transition); cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 500; }
        .sidebar .nav-item:hover { background: rgba(45,212,191,0.1); color: var(--accent); transform: translateX(4px); }
        .sidebar .nav-item.active { background: linear-gradient(135deg, rgba(45,212,191,0.2), rgba(45,212,191,0.05)); color: var(--accent); border-left: 3px solid var(--accent); }
        .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .top-header { background: white; padding: 16px 32px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 99; backdrop-filter: blur(8px); }
        .filter-bar { background: white; padding: 16px 24px; margin: 0 24px 24px 24px; border-radius: 20px; box-shadow: var(--card-shadow); display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; min-width: 140px; }
        .filter-group label { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .filter-group select, .filter-group input { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 13px; background: white; transition: var(--transition); }
        .filter-group select:focus, .filter-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,212,191,0.1); }
        .btn-sm-custom { background: linear-gradient(135deg, #2dd4bf, #14b8a6); color: white; padding: 8px 24px; border-radius: 30px; font-size: 13px; font-weight: 600; border: none; transition: var(--transition); cursor: pointer; }
        .btn-sm-custom:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(45,212,191,0.3); }
        .page-padding { padding: 24px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .kds-card { background: white; border-radius: 20px; padding: 20px; box-shadow: var(--card-shadow); border-top: 3px solid var(--accent); height: 100%; transition: var(--transition); }
        .kds-card:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); }
        .stat-val { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #1e293b, #334155); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge-basarili { background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: 600; }
        .badge-kritik { background: #fee2e2; color: #991b1b; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: 600; }
        .badge-orta { background: #fef3c7; color: #92400e; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: 600; }
        .badge-muaf { background: #e2e8f0; color: #475569; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: 600; }
        .rank-card { background: #f8fafc; border-radius: 14px; padding: 12px; margin-bottom: 8px; transition: var(--transition); border: 1px solid #e2e8f0; }
        .rank-card:hover { transform: translateX(6px); border-color: var(--accent); }
        .rank-number { width: 28px; height: 28px; background: var(--accent); color: white; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; margin-right: 10px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal-container { background: white; width: 650px; max-width: 90%; max-height: 85vh; overflow-y: auto; border-radius: 28px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); padding: 24px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 16px; }
        .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: #94a3b8; transition: var(--transition); }
        .modal-close:hover { color: #ef4444; transform: scale(1.1); }
        .gosterge-detay { background: #f8fafc; border-radius: 14px; padding: 12px 16px; margin: 8px 0; }
        .pdf-iframe { width: 100%; height: 400px; border: none; border-radius: 12px; margin-top: 12px; }
        .toast-notification { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 40px; font-size: 13px; z-index: 1100; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast-notification.show { opacity: 1; }
        .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 12px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .chart-container { position: relative; height: 320px; margin-top: 16px; }
        /* Responsive */
        @media (max-width: 768px) { .sidebar { width: 80px; } .sidebar .nav-item span:last-child { display: none; } .filter-bar { flex-direction: column; } .filter-group { width: 100%; } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <aside class="sidebar">
        <div class="p-4 text-center border-bottom border-white/10"><h5 class="fw-bold mb-0 text-white">🏥 KDS</h5><p class="text-xs text-teal-300 mt-1">Performans Takip</p></div>
        <nav class="mt-3">
            <div class="nav-item" data-page="genel-bakis"><i class="bi bi-speedometer2"></i><span>Genel Bakış</span></div>
            <div class="nav-item" data-page="tum-bolge"><i class="bi bi-grid-3x3-gap"></i><span>Tüm Bölge</span></div>
            <div class="nav-item" data-page="kurum-bazli"><i class="bi bi-hospital"></i><span>Kurum Bazlı</span></div>
            <div class="nav-item" data-page="karsilastirma"><i class="bi bi-arrow-left-right"></i><span>Karşılaştırma</span></div>
            <div class="nav-item" data-page="raporlar"><i class="bi bi-graph-up"></i><span>Raporlar</span></div>
            <div class="nav-item" data-page="itirazlar"><i class="bi bi-chat-dots"></i><span>İtirazlar</span></div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h5 id="page-title" class="mb-0 fw-bold">Genel Bakış</h5>
            <div class="badge bg-success px-3">🟢 Canlı</div>
        </header>
        <div id="filter-bar" class="filter-bar" style="display: none;">
            <div class="filter-group"><label>Yıl</label><select id="f-yil"><option value="2026">2026</option></select></div>
            <div class="filter-group"><label>Dönem</label><select id="f-donem"><option value="1">Ocak</option><option value="2">Şubat</option><option value="3">Mart</option></select></div>
            <div class="filter-group"><label>Kurum Türü</label><select id="f-tip"><option value="">Tümü</option><option value="Hastane">Hastane</option><option value="ADSM">ADSM/ADSH</option></select></div>
            <div class="filter-group"><label>Kurum Adı</label><select id="f-kurum"><option value="">Seçiniz</option></select></div>
            <button class="btn-sm-custom" id="kurumSorgulaBtn">🔍 Sorgula</button>
        </div>
        <div class="page-padding" id="page-container"></div>
    </main>
</div>

<div id="toast" class="toast-notification"></div>
<div id="gostergeModal" class="modal-overlay"><div class="modal-container"><div class="modal-header"><h4 id="modalBaslik">Gösterge Detayı</h4><button class="modal-close" onclick="kapatModal()">&times;</button></div><div id="modalIcerik">Yükleniyor...</div></div></div>

<script>
    // ========== KONFİGÜRASYON ==========
    const SUPABASE_URL = "https://alisjxtoivkeyeyyuikr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_dToCJocokZ1QVw8-oHTe6Q_72u3p7Of";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const AYLAR = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
    let charts = {};
    let currentPage = "genel-bakis";

    // ========== YARDIMCI FONKSİYONLAR ==========
    function showToast(msg, type = "success") {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.style.background = type === "error" ? "#dc2626" : "#1e293b";
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
    }

    async function fetchData(table, filters = {}) {
        try {
            let query = supabase.from(table).select('*');
            Object.entries(filters).forEach(([key, val]) => { if (val !== undefined && val !== "") query = query.eq(key, val); });
            const { data, error } = await query;
            if (error) throw error;
            return data || [];
        } catch (err) {
            console.error(`Fetch error on ${table}:`, err);
            showToast("Veri çekme hatası: " + err.message, "error");
            return [];
        }
    }

    function puanGoster(puan, gp) {
        if (puan === null || puan === undefined) return '<span class="badge-muaf">MUAF</span>';
        const cls = puan < gp/2 ? 'text-red-600' : 'text-green-600';
        return `<span class="font-bold ${cls}">${puan}/${gp}</span>`;
    }

    function degerlendir(gd, trOrt, yon, puan, gp) {
        if (gd === null || gd === undefined || trOrt === null || trOrt === undefined) return { class: 'badge-muaf', text: '🔘 Muaf' };
        const ilOrtBasari = yon === 'Pozitif' ? gd >= trOrt : gd <= trOrt;
        const puanOrani = (puan / gp) * 100;
        if (ilOrtBasari && puanOrani >= 75) return { class: 'badge-basarili', text: '✅ Mükemmel' };
        if (ilOrtBasari && puanOrani >= 50) return { class: 'badge-basarili', text: '✅ Başarılı' };
        if (!ilOrtBasari && puanOrani >= 50) return { class: 'badge-orta', text: '⚠️ Gelişmeli' };
        return { class: 'badge-kritik', text: '❌ Kritik' };
    }

    function yonOku(yon) { return yon === 'Pozitif' ? '<span class="text-emerald-600">↑ Pozitif</span>' : '<span class="text-rose-600">↓ Negatif</span>'; }

    function pdfUrlGetir(gostergeKodu) {
        if (!gostergeKodu) return null;
        if (gostergeKodu.startsWith('SYPG-BH-')) {
            const num = gostergeKodu.split('-')[2];
            return `https://raw.githubusercontent.com/ahmtylmz3441-sys/kds-performans-kuzey/pendikismdenetim/dokumanlar/h${num}.pdf`;
        } else if (gostergeKodu.startsWith('SYPG-ADSH-')) {
            const num = gostergeKodu.split('-')[2];
            return `https://raw.githubusercontent.com/ahmtylmz3441-sys/kds-performans-kuzey/pendikismdenetim/dokumanlar/a${num}.pdf`;
        }
        return null;
    }

    // ========== MODAL ==========
    window.gostergeDetayGoster = function(id, ad, gd, trOrt, puan, gp, yon, gostergeKodu) {
        document.getElementById('modalBaslik').innerHTML = `📊 ${ad}`;
        const yonTuru = yon === 'Pozitif' ? '↑ Pozitif (Artmalı)' : '↓ Negatif (Azalmalı)';
        let html = `<div class="gosterge-detay"><strong>🎯 Hedef Yönü:</strong> ${yonTuru}</div>
                    <div class="gosterge-detay"><strong>📈 GD:</strong> ${gd ?? '-'}</div>
                    <div class="gosterge-detay"><strong>📊 TR Ort:</strong> ${trOrt ?? '-'}</div>
                    <div class="gosterge-detay"><strong>⭐ Puan:</strong> ${puan ?? 'null'}/${gp ?? '-'}</div>`;
        const pdfUrl = pdfUrlGetir(gostergeKodu);
        if (pdfUrl) html += `<div class="gosterge-detay"><strong>📄 Doküman:</strong><iframe src="${pdfUrl}" class="pdf-iframe"></iframe><a href="${pdfUrl}" target="_blank" class="text-blue-600 text-sm mt-2 d-block">🔗 Yeni sekmede aç</a></div>`;
        else html += `<div class="gosterge-detay"><strong>📄 Doküman:</strong> Henüz yüklenmedi</div>`;
        document.getElementById('modalIcerik').innerHTML = html;
        document.getElementById('gostergeModal').classList.add('active');
    };
    window.kapatModal = () => document.getElementById('gostergeModal').classList.remove('active');
    document.getElementById('gostergeModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) window.kapatModal(); });

    // ========== SAYFA YÖNLENDİRME ==========
    async function loadPage(page) {
        currentPage = page;
        const container = document.getElementById('page-container');
        container.innerHTML = '<div class="skeleton" style="height: 400px; width: 100%; border-radius: 20px;"></div>';
        document.getElementById('filter-bar').style.display = page === 'kurum-bazli' ? 'flex' : 'none';
        if (page === 'genel-bakis') await renderDashboard(container);
        else if (page === 'tum-bolge') await renderTumBolge(container);
        else if (page === 'kurum-bazli') await renderKurumBazli(container);
        else if (page === 'karsilastirma') await renderKarsilastirma(container);
        else if (page === 'raporlar') await renderRaporlar(container);
        else if (page === 'itirazlar') await renderItirazlar(container);
    }

    // ========== DASHBOARD ==========
    async function renderDashboard(container) {
        const perfData = await fetchData('performans');
        const kurumSayisi = new Set(perfData.map(r => r.kurum_adi)).size;
        const sonDonem = Math.max(...perfData.map(r => r.donem));
        const sonVeri = perfData.filter(r => r.donem === sonDonem);
        const hastane = sonVeri.filter(x => x.kurum_tipi === 'Hastane');
        const adsm = sonVeri.filter(x => x.kurum_tipi === 'ADSM');
        const hOrt = hastane.length ? (hastane.reduce((s,v)=>s+v.toplam_puan,0)/hastane.length).toFixed(1) : '0';
        const aOrt = adsm.length ? (adsm.reduce((s,v)=>s+v.toplam_puan,0)/adsm.length).toFixed(1) : '0';
        const topH = hastane.sort((a,b)=>b.toplam_puan - a.toplam_puan).slice(0,5);
        const topA = adsm.sort((a,b)=>b.toplam_puan - a.toplam_puan).slice(0,5);
        container.innerHTML = `
            <div class="row g-4 mb-4">
                <div class="col-md-4"><div class="kds-card"><h6>📊 Toplam Kurum</h6><div class="stat-val">${kurumSayisi}</div></div></div>
                <div class="col-md-4"><div class="kds-card" style="border-top-color:#0d6efd"><h6>🏥 Hastane Ortalaması</h6><div class="stat-val text-primary">${hOrt}</div></div></div>
                <div class="col-md-4"><div class="kds-card" style="border-top-color:#6610f2"><h6>🏛️ ADSM Ortalaması</h6><div class="stat-val">${aOrt}</div></div></div>
            </div>
            <div class="row g-4">
                <div class="col-md-6"><div class="kds-card"><h6>🏆 En İyi 5 Hastane</h6>${topH.map((k,i)=>`<div class="rank-card"><span class="rank-number">${i+1}</span> <strong>${k.kurum_adi}</strong> <span class="float-end text-primary fw-bold">${k.toplam_puan} puan</span></div>`).join('')}</div></div>
                <div class="col-md-6"><div class="kds-card"><h6>🏆 En İyi 5 ADSM/ADSH</h6>${topA.map((k,i)=>`<div class="rank-card"><span class="rank-number">${i+1}</span> <strong>${k.kurum_adi}</strong> <span class="float-end text-primary fw-bold">${k.toplam_puan} puan</span></div>`).join('')}</div></div>
            </div>
        `;
    }

    // ========== TÜM BÖLGE ==========
    async function renderTumBolge(container) {
        const perfData = await fetchData('performans');
        const sonDonem = Math.max(...perfData.map(r => r.donem));
        const data = perfData.filter(r => r.donem === sonDonem).sort((a,b)=>b.toplam_puan - a.toplam_puan);
        container.innerHTML = `
            <div class="kds-card">
                <h6>🌍 Tüm Kurumlar Sıralaması (${AYLAR[sonDonem-1]} 2026)</h6>
                <div class="table-responsive mt-3">
                    <table class="table table-hover">
                        <thead class="table-light"><tr><th>Kurum</th><th>Tür</th><th>Puan</th><th>Rol Ort.</th><th>Durum</th></tr></thead>
                        <tbody>${data.map(d => `</tr><td><strong>${d.kurum_adi}</strong>｟<td>${d.kurum_tipi}｟<td class="fw-bold text-primary">${d.toplam_puan}｟<td>${d.tr_ort ?? '-'}｟<td>${d.toplam_puan >= (d.tr_ort||0) ? '<span class="badge-basarili">✅ Başarılı</span>' : '<span class="badge-kritik">⚠️ Gelişmeli</span>'}｟</tr>`).join('')}</tbody>
                    </table>
                </div>
            </div>
        `;
    }

    // ========== KURUM BAZLI ==========
    async function renderKurumBazli(container) {
        // Kurum türüne göre kurum listesini güncelle
        const perfData = await fetchData('performans');
        const kurumTipSelect = document.getElementById('f-tip');
        const kurumSelect = document.getElementById('f-kurum');
        const updateKurumlar = () => {
            const tip = kurumTipSelect.value;
            let kurumlar = [...new Set(perfData.map(r => r.kurum_adi))];
            if (tip) kurumlar = [...new Set(perfData.filter(r => r.kurum_tipi === tip).map(r => r.kurum_adi))];
            kurumlar.sort();
            kurumSelect.innerHTML = '<option value="">Seçiniz</option>' + kurumlar.map(k => `<option value="${k}">${k}</option>`).join('');
        };
        kurumTipSelect.onchange = updateKurumlar;
        updateKurumlar();
        container.innerHTML = `<div class="kds-card" id="kurumAnalizContainer"><p class="text-center text-muted">Kurum seçip "Sorgula" butonuna tıklayın.</p></div>`;
        document.getElementById('kurumSorgulaBtn').onclick = async () => {
            const kurum = kurumSelect.value;
            const donem = parseInt(document.getElementById('f-donem').value);
            if (!kurum) { showToast("Lütfen bir kurum seçin", "error"); return; }
            const donemAdi = AYLAR[donem-1];
            const { data } = await supabase.from('performans').select('*').eq('kurum_adi', kurum).eq('donem', donem);
            if (!data?.length) { document.getElementById('kurumAnalizContainer').innerHTML = '<div class="alert alert-warning">Veri bulunamadı</div>'; return; }
            const perf = data.sort((a,b) => parseInt(a.gosterge_kodu.split('-')[2]) - parseInt(b.gosterge_kodu.split('-')[2]));
            let html = `<div class="kurum-baslik">📊 ${kurum} - ${donemAdi} 2026</div>`;
            html += `<div class="table-responsive"><table class="table table-sm"><thead class="table-light"><tr><th>Gösterge</th><th>Yön</th><th>GD</th><th>TR Ort</th><th>Puan/GP</th><th>Değerlendirme</th><th>İtiraz</th></tr></thead><tbody>`;
            for (const r of perf) {
                const durum = degerlendir(r.gd, r.tr_ort, r.gosterge_yonu, r.puan, r.gp);
                html += `<tr>
                    <td><a href="#" onclick="gostergeDetayGoster('${r.id}','${r.gosterge_adi.replace(/'/g,"\\'")}',${r.gd},${r.tr_ort},${r.puan},${r.gp},'${r.gosterge_yonu}','${r.gosterge_kodu}'); return false;" style="color:#0d6efd; text-decoration:none;">${r.gosterge_adi}</a></td>
                    <td>${yonOku(r.gosterge_yonu)}</td><td>${r.gd??'-'}</td><td>${r.tr_ort??'-'}</td>
                    <td>${puanGoster(r.puan, r.gp)}</td><td><span class="${durum.class}">${durum.text}</span></td>
                    <td><button class="itiraz-btn btn btn-warning btn-sm" onclick="itirazEkle('${r.id}','${kurum}','${r.gosterge_adi}',${r.yil},${r.donem})">📝 İtiraz Et</button></td>
                </tr>`;
            }
            html += `</tbody></table></div>`;
            document.getElementById('kurumAnalizContainer').innerHTML = html;
        };
    }

    // ========== KARŞILAŞTIRMA ==========
    async function renderKarsilastirma(container) {
        container.innerHTML = `<div class="kds-card"><h6>🔀 Dönemsel Karşılaştırma</h6><p class="text-muted">Seçilen kurumun farklı dönemlerini karşılaştırın</p><div id="karsilastirmaContent">Yükleniyor...</div></div>`;
        // Basit bir örnek: dönemleri listeleyip karşılaştırma yapılabilir (kısa tutuldu)
        const kurumlar = await fetchData('performans');
        const kurumList = [...new Set(kurumlar.map(k => k.kurum_adi))];
        let html = `<div class="row g-3"><div class="col-md-5"><label>Kurum</label><select id="karKurum" class="form-select">${kurumList.map(k=>`<option>${k}</option>`).join('')}</select></div>
                    <div class="col-md-5"><label>Dönem 1</label><select id="karDonem1" class="form-select">${[1,2,3].map(d=>`<option value="${d}">${AYLAR[d-1]}</option>`).join('')}</select></div>
                    <div class="col-md-5"><label>Dönem 2</label><select id="karDonem2" class="form-select">${[1,2,3].map(d=>`<option value="${d}">${AYLAR[d-1]}</option>`).join('')}</select></div>
                    <div class="col-md-2"><button class="btn-sm-custom mt-4" id="karsilastirBtn">Karşılaştır</button></div></div><div id="karsilastirSonuc" class="mt-4"></div>`;
        document.getElementById('karsilastirmaContent').innerHTML = html;
        document.getElementById('karsilastirBtn').onclick = async () => {
            const kurum = document.getElementById('karKurum').value;
            const d1 = parseInt(document.getElementById('karDonem1').value);
            const d2 = parseInt(document.getElementById('karDonem2').value);
            const { data: onceki } = await supabase.from('performans').select('gosterge_adi,gd').eq('kurum_adi', kurum).eq('donem', d1);
            const { data: sonraki } = await supabase.from('performans').select('gosterge_adi,gd').eq('kurum_adi', kurum).eq('donem', d2);
            const map = Object.fromEntries(onceki.map(o=>[o.gosterge_adi, o.gd]));
            let rows = '';
            for (const s of sonraki) {
                const once = map[s.gosterge_adi];
                if (once !== undefined) {
                    const fark = (s.gd - once).toFixed(1);
                    const ok = fark > 0 ? '🟢' : '🔴';
                    rows += `<tr><td>${s.gosterge_adi}</td><td>${once}</td><td>${s.gd}</td><td>${ok} ${fark}</td></tr>`;
                }
            }
            document.getElementById('karsilastirSonuc').innerHTML = `<div class="table-responsive"><table class="table table-bordered"><thead><tr><th>Gösterge</th><th>${AYLAR[d1-1]}</th><th>${AYLAR[d2-1]}</th><th>Değişim</th></tr></thead><tbody>${rows}</tbody></table></div>`;
        };
    }

    // ========== RAPORLAR ==========
    async function renderRaporlar(container) {
        container.innerHTML = `<div class="kds-card"><h6>📊 Raporlar</h6><p class="text-muted">Gösterge bazlı trend analizi</p>
            <div class="row"><div class="col-md-4"><label>Gösterge</label><select id="raporGosterge" class="form-select"></select></div>
            <div class="col-md-2"><button class="btn-sm-custom mt-4" id="raporGrafikBtn">Grafik Oluştur</button></div></div>
            <div class="chart-container mt-3"><canvas id="raporChart"></canvas></div></div>`;
        const gostergeler = await fetchData('performans');
        const gList = [...new Set(gostergeler.map(g=>g.gosterge_adi))];
        document.getElementById('raporGosterge').innerHTML = '<option value="">Seçiniz</option>' + gList.map(g=>`<option>${g}</option>`).join('');
        document.getElementById('raporGrafikBtn').onclick = async () => {
            const secilen = document.getElementById('raporGosterge').value;
            if (!secilen) return;
            const { data } = await supabase.from('performans').select('donem,gd').eq('gosterge_adi', secilen).order('donem');
            const donemler = [...new Set(data.map(d=>d.donem))];
            const degerler = donemler.map(d=> data.find(r=>r.donem===d)?.gd || 0);
            if (window.raporChart) window.raporChart.destroy();
            window.raporChart = new Chart(document.getElementById('raporChart'), { type: 'line', data: { labels: donemler.map(d=>AYLAR[d-1]), datasets: [{ label: secilen, data: degerler, borderColor: '#2dd4bf', tension: 0.3 }] } });
        };
    }

    // ========== İTİRAZLAR ==========
    async function renderItirazlar(container) {
        const itirazlar = await fetchData('itirazlar');
        if (!itirazlar.length) { container.innerHTML = `<div class="kds-card"><h6>⚠️ İtirazlar</h6><p class="text-muted">Henüz itiraz yok.</p></div>`; return; }
        const performansIds = itirazlar.map(i=>i.performans_id);
        const { data: perfData } = await supabase.from('performans').select('id,kurum_adi,gosterge_adi').in('id', performansIds);
        const perfMap = Object.fromEntries(perfData.map(p=>[p.id, p]));
        container.innerHTML = `<div class="kds-card"><h6>⚠️ İtiraz Yönetimi</h6><div class="list-group">${itirazlar.map(it=>`<div class="list-group-item"><div class="fw-bold">${perfMap[it.performans_id]?.kurum_adi}</div><div>${perfMap[it.performans_id]?.gosterge_adi}</div><p>${it.itiraz_metni}</p><span class="badge bg-secondary">${it.durum}</span></div>`).join('')}</div></div>`;
    }

    // ========== İTİRAZ EKLEME ==========
    window.itirazEkle = async function(pid, kurum, gosterge, yil, donem) {
        const metin = prompt(`${kurum}\n${gosterge}\n${yil}/${donem}\nİtiraz nedeni:`);
        if (!metin) return;
        const { error } = await supabase.from('itirazlar').insert({ performans_id: pid, itiraz_metni: metin, durum: 'beklemede' });
        if (error) showToast("Hata: " + error.message, "error");
        else { showToast("✅ İtiraz kaydedildi"); loadPage(currentPage); }
    };

    // ========== MENÜ OLAYLARI ==========
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            item.classList.add('active');
            const page = item.getAttribute('data-page');
            document.getElementById('page-title').innerText = item.innerText.trim();
            loadPage(page);
        });
    });
    loadPage('genel-bakis');
</script>
</body>
</html>
