<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHHB-2 GÖREN ANALİZ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #f8fafc; color: #0f172a; }
    .hidden { display: none !important; }
    
    /* Login */
    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .login-box { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 420px; }
    .login-box h2 { text-align: center; margin-bottom: 2rem; font-size: 1.75rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #334155; }
    .form-group input { width: 100%; padding: 0.875rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s; }
    .form-group input:focus { outline: none; border-color: #2563eb; }
    .form-group input.error { border-color: #dc2626; }
    .error-msg { color: #dc2626; font-size: 0.8rem; margin-top: 0.3rem; display: none; }
    .error-msg.show { display: block; }
    .btn { width: 100%; padding: 0.875rem; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .demo-info { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b; }
    
    /* Dashboard */
    .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 2px solid #e2e8f0; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #2563eb; }
    .user-info { display: flex; gap: 1rem; align-items: center; font-size: 0.95rem; }
    .btn-logout { padding: 0.5rem 1rem; background: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .btn-logout:hover { background: #b91c1c; }
    
    .filters { display: flex; gap: 1rem; background: white; padding: 1.25rem; border-radius: 12px; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); flex-wrap: wrap; align-items: flex-end; }
    .filter-group { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 140px; }
    .filter-group label { font-size: 0.8rem; color: #64748b; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; }
    .filter-group select { padding: 0.65rem; border: 1px solid #e2e8f0; border-radius: 6px; background: white; font-size: 0.95rem; }
    .status-badge { background: #dcfce7; color: #166534; padding: 0.4rem 0.8rem; border-radius: 99px; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem; }
    .btn-query { background: #2563eb; color: white; padding: 0.65rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; height: fit-content; }
    .btn-query:hover { background: #1d4ed8; }
    
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
    .kpi-card { background: white; padding: 1.5rem; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .kpi-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .kpi-label { font-size: 0.85rem; color: #64748b; margin-bottom: 0.5rem; }
    .kpi-value { font-size: 2.25rem; font-weight: 700; color: #0f172a; }
    
    .table-section { background: white; border-radius: 12px; padding: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; font-weight: 600; color: #475569; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; }
    tr:hover td { background: #f8fafc; }
    .status { padding: 0.35rem 0.8rem; border-radius: 99px; font-size: 0.8rem; font-weight: 500; display: inline-block; }
    .status-tamam { background: #dcfce7; color: #166534; }
    .status-bekle { background: #fef3c7; color: #92400e; }
    .status-itiraz { background: #fee2e2; color: #991b1b; }
    .empty-state { text-align: center; padding: 2.5rem; color: #94a3b8; }
    
    .toast { position: fixed; top: 1.5rem; right: 1.5rem; padding: 1rem 1.5rem; border-radius: 8px; color: white; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,0.15); z-index: 2000; animation: slideIn 0.3s ease; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    
    @media (max-width: 768px) {
      .filters { flex-direction: column; }
      .filter-group { width: 100%; }
      .kpi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 🔐 LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <h2>🏥 KHHB-2 Giriş</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">E-posta</label>
          <input type="email" id="email" placeholder="ornek@kurum.gov.tr" value="admin@test.com">
          <div class="error-msg" id="err-email">Geçerli bir e-posta adresi giriniz</div>
        </div>
        <div class="form-group">
          <label for="pass">Şifre</label>
          <input type="password" id="pass" placeholder="••••••••" value="123456">
          <div class="error-msg" id="err-pass">Şifre en az 6 karakter olmalıdır</div>
        </div>
        <button type="submit" class="btn" id="btn-login">Giriş Yap</button>
      </form>
      <p class="demo-info">Demo: admin@test.com / 123456</p>
    </div>
  </div>

  <!-- 🖥️ DASHBOARD -->
  <div id="dashboard" class="hidden">
    <div class="container">
      <header class="header">
        <div class="logo">🏥 KHHB-2 GÖREN ANALİZ</div>
        <div class="user-info">
          <span id="user-name">Kullanıcı</span>
          <button class="btn-logout" id="btn-logout">Çıkış</button>
        </div>
      </header>

      <section class="filters">
        <span class="status-badge">🟢 Canlı</span>
        <div class="filter-group">
          <label>Yıl</label>
          <select id="f-yil"><option value="2026">2026</option><option value="2025">2025</option></select>
        </div>
        <div class="filter-group">
          <label>Dönem</label>
          <select id="f-donem">
            <option value="1">Ocak</option><option value="2">Şubat</option><option value="3">Mart</option>
            <option value="4">Nisan</option><option value="5">Mayıs</option><option value="6">Haziran</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Kurum Türü</label>
          <select id="f-tur">
            <option value="Tümü">Tümü</option>
            <option value="Hastane">Hastane</option>
            <option value="ADSM">ADSM/ADSH</option>
          </select>
        </div>
        <button class="btn-query" id="btn-query">🔍 Sorgula</button>
      </section>

      <section class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon">📊</div>
          <div class="kpi-label">Toplam Kurum</div>
          <div class="kpi-value" id="kpi-total">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon">🏥</div>
          <div class="kpi-label">Hastane Ortalaması</div>
          <div class="kpi-value" id="kpi-hosp">0.0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon">🏛️</div>
          <div class="kpi-label">ADSM Ortalaması</div>
          <div class="kpi-value" id="kpi-adsm">0.0</div>
        </div>
      </section>

      <section class="table-section">
        <table>
          <thead>
            <tr><th>Kurum</th><th>Tür</th><th>Puan</th><th>Rol Ortalaması</th><th>Durum</th></tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="5" class="empty-state">Sorgulama yapınız...</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </div>

  <script type="module">
    // ✅ ESM Import - GitHub Pages uyumlu
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.8';

    // 🔑 CONFIG
    const CONFIG = {
      SUPABASE_URL: 'https://alisjxtoivkeyeyyuikr.supabase.co',
      SUPABASE_ANON_KEY: 'sb_publishable_dToCJocokZ1QVw8-oHTe6Q_72u3p7Of'
    };

    // Supabase client
    const supabase = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    let currentUser = null;

    // 🍞 Toast notification
    function toast(msg, type = 'error') {
      document.querySelector('.toast')?.remove();
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    // 🔐 LOGIN
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      const btn = document.getElementById('btn-login');
      
      // Validasyon
      let valid = true;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('err-email').classList.add('show');
        document.getElementById('email').classList.add('error');
        valid = false;
      } else {
        document.getElementById('err-email').classList.remove('show');
        document.getElementById('email').classList.remove('error');
      }
      
      if (pass.length < 6) {
        document.getElementById('err-pass').classList.add('show');
        document.getElementById('pass').classList.add('error');
        valid = false;
      } else {
        document.getElementById('err-pass').classList.remove('show');
        document.getElementById('pass').classList.remove('error');
      }
      
      if (!valid) return;
      
      // Login
      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor...';
      
      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: pass
        });
        
        if (error) throw error;
        
        currentUser = data.user;
        
        // Profile bilgilerini çek
        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('rol, ad_soyad, email')
          .eq('id', currentUser.id)
          .single();
        
        if (profileError || !profile) {
          throw new Error('Profil bulunamadı. Lütfen admin ile iletişime geçin.');
        }
        
        // Dashboard'u göster
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('user-name').textContent = profile.ad_soyad || email;
        
        toast('Giriş başarılı! Hoş geldiniz.', 'success');
        
        // İlk veri yükleme
        loadData();
        
      } catch (err) {
        console.error('Login error:', err);
        toast(err.message || 'Giriş başarısız. Lütfen bilgilerinizi kontrol edin.', 'error');
        btn.disabled = false;
        btn.textContent = 'Giriş Yap';
      }
    });

    // 🚪 LOGOUT
    document.getElementById('btn-logout').addEventListener('click', async () => {
      if (confirm('Çıkış yapmak istediğinize emin misiniz?')) {
        await supabase.auth.signOut();
        location.reload();
      }
    });

    // 📊 VERİ YÜKLE
    document.getElementById('btn-query').addEventListener('click', loadData);

    async function loadData() {
      const btn = document.getElementById('btn-query');
      btn.textContent = '⏳ Yükleniyor...';
      btn.disabled = true;
      
      try {
        const yil = document.getElementById('f-yil').value;
        const donem = document.getElementById('f-donem').value;
        const tur = document.getElementById('f-tur').value;
        
        // Supabase'den veri çek
        let query = supabase
          .from('toplam_puanlar')
          .select('*')
          .eq('yil', parseInt(yil))
          .eq('donem', parseInt(donem))
          .order('toplam_puan', { ascending: false })
          .limit(50);
        
        if (tur !== 'Tümü') {
          query = query.eq('kurum_tipi', tur);
        }
        
        const { data, error } = await query;
        
        if (error) throw error;
        
        // Veriyi render et
        renderData(data || []);
        
      } catch (err) {
        console.error('Data error:', err);
        toast('Veritabanı bağlantısı başarısız. Demo veriler gösteriliyor.', 'error');
        
        // Demo veri (fallback)
        const demoData = [
          { kurum_adi: 'İstanbul Şehir Hastanesi', kurum_tipi: 'Hastane', toplam_puan: 94.2, rol_ortalamasi: 89.5, durum: 'Tamamlandı' },
          { kurum_adi: 'Ankara Merkez ADSM', kurum_tipi: 'ADSM', toplam_puan: 81.7, rol_ortalamasi: 78.3, durum: 'Beklemede' },
          { kurum_adi: 'Ümraniye Eğitim ve Araştırma Hastanesi', kurum_tipi: 'Hastane', toplam_puan: 92.1, rol_ortalamasi: 88.7, durum: 'Tamamlandı' }
        ];
        renderData(demoData);
      } finally {
        btn.textContent = '🔍 Sorgula';
        btn.disabled = false;
      }
    }

    function renderData(data) {
      // KPI hesaplamaları
      const total = data.length;
      const hosp = data.filter(d => d.kurum_tipi === 'Hastane');
      const adsm = data.filter(d => d.kurum_tipi === 'ADSM');
      
      const avg = (arr) => {
        if (!arr.length) return '0.0';
        const sum = arr.reduce((acc, item) => acc + (parseFloat(item.toplam_puan) || 0), 0);
        return (sum / arr.length).toFixed(1);
      };
      
      document.getElementById('kpi-total').textContent = total;
      document.getElementById('kpi-hosp').textContent = avg(hosp);
      document.getElementById('kpi-adsm').textContent = avg(adsm);
      
      // Tablo render
      const tbody = document.getElementById('table-body');
      
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Sonuç bulunamadı</td></tr>';
        return;
      }
      
      tbody.innerHTML = data.map(d => `
        <tr>
          <td><strong>${d.kurum_adi || '-'}</strong></td>
          <td>${d.kurum_tipi || '-'}</td>
          <td><strong>${parseFloat(d.toplam_puan).toFixed(1) || '-'}</strong></td>
          <td>${parseFloat(d.rol_ortalamasi).toFixed(1) || '-'}</td>
          <td><span class="status ${getStatusClass(d.durum)}">${d.durum || '-'}</span></td>
        </tr>
      `).join('');
    }

    function getStatusClass(durum) {
      if (durum === 'Tamamlandı') return 'status-tamam';
      if (durum === 'İtiraz Edildi') return 'status-itiraz';
      return 'status-bekle';
    }

    // 🔄 Session kontrolü (sayfa yenilendiğinde)
    async function checkSession() {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        
        if (session && session.user) {
          const { data: profile } = await supabase
            .from('profiles')
            .select('rol, ad_soyad')
            .eq('id', session.user.id)
            .single();
          
          if (profile) {
            currentUser = session.user;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('user-name').textContent = profile.ad_soyad || session.user.email;
            loadData();
          }
        }
      } catch (err) {
        console.error('Session check error:', err);
      }
    }

    // 🚀 Başlat
    checkSession();
  </script>
</body>
</html>
