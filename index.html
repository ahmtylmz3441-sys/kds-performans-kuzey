<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KDS Performans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="p-4">
    <h1>🏥 KDS Performans Sistemi</h1>
    <div id="cikti" class="alert alert-secondary">Yükleniyor...</div>

    <script>
        // SADECE BURADA TANIMLI
        const SUPABASE_URL = "https://alisjxtoivkeyeyyuikr.supabase.co";
        const SUPABASE_KEY = "sb_publishable_dToCJocokZ1QVw8-oHTe6Q_72u3p7Of";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function veriGetir() {
            const cikti = document.getElementById('cikti');
            cikti.innerHTML = "Veri çekiliyor...";
            
            try {
                // Önce toplam_puanlar tablosunu sorgula
                const { data: toplamlar, error: err1 } = await supabaseClient
                    .from('toplam_puanlar')
                    .select('*')
                    .limit(5);
                
                if (err1) {
                    cikti.innerHTML = `<div class="alert alert-danger">❌ Hata: ${err1.message}</div>`;
                    return;
                }
                
                if (!toplamlar || toplamlar.length === 0) {
                    cikti.innerHTML = `<div class="alert alert-warning">⚠️ Veritabanında 'toplam_puanlar' tablosunda veri yok.</div>`;
                    return;
                }
                
                // Tablo oluştur
                let html = `<div class="alert alert-success">✅ Bağlantı başarılı! ${toplamlar.length} satır veri geldi.</div>`;
                html += `<table class="table table-bordered table-striped">`;
                html += `<thead class="table-dark"><tr><th>#</th><th>Kurum Adı</th><th>Toplam Puan</th><th>Rol Ortalaması</th><th>Dönem</th></tr></thead><tbody>`;
                
                toplamlar.forEach((item, index) => {
                    html += `<tr>
                        <td>${index + 1}</td>
                        <td>${item.kurum_adi || '-'}</td>
                        <td><b>${item.toplam_puan || 0}</b></td>
                        <td>${item.rol_ortalamasi || 0}</td>
                        <td>${item.donem || '-'}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                cikti.innerHTML = html;
                
            } catch (hata) {
                cikti.innerHTML = `<div class="alert alert-danger">❌ Beklenmeyen hata: ${hata.message}</div>`;
            }
        }
        
        veriGetir();
    </script>
</body>
</html>
