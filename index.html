<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHHB-2 GÖREN ANALİZ</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --card: #fff; --text: #0f172a; --border: #e2e8f0; --success: #16a34a; --danger: #dc2626; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); }
    .hidden { display: none !important; }
    
    /* Login */
    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .login-box { background: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
    .login-box h2 { text-align: center; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 500; }
    .form-group input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
    .btn { width: 100%; padding: 0.8rem; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .error { color: var(--danger); font-size: 0.8rem; margin-top: 0.3rem; display: none; }
    .error.show { display: block; }
    .toast { position: fixed; top: 1rem; right: 1rem; padding: 0.8rem 1.2rem; background: var(--danger); color: #fff; border-radius: 8px; z-index: 2000; }
    .toast.success { background: var(--success); }
    
    /* Dashboard */
    .container { max-width: 1280px; margin: 0 auto; padding: 1rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.25rem; font-weight: 700; }
    .user-info { display: flex; gap: 1rem; align-items: center; }
    .btn-sm { padding: 0.4rem 0.8rem; background: var(--danger); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    
    .filters { display: flex; gap: 0.8rem; background: var(--card); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filter-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .filter-group label { font-size: 0.75rem; color: #64748b; }
    .filter-group select { padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; }
    .btn-query { background: var(--primary); color: #fff; padding: 0.6rem 1.3rem; border: none; border-radius: 6px; cursor: pointer; height: fit-content; }
    
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .kpi-card { background: var(--card); padding: 1.2rem; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .kpi-value { font-size: 2rem; font-weight: 700; margin: 0.4rem 0; }
    
    .table-section { background: var(--card); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.9rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; font-weight: 600; }
    .status { padding: 0.3rem 0.7rem; border-radius: 99px; font-size: 0.75rem; }
    .status-tamam { background: #dcfce7; color: #166534; }
    .status-bekle { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <h2>🏥 KHHB-2 Giriş</h2>
      <form id="login-form">
        <div class="form-group">
          <label>E-posta</label>
          <input type="email" id="email" placeholder="admin@test.com" value="admin@test.com">
          <div class="error" id="err-email">Geçerli e-posta girin</div>
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" id="pass" placeholder="123456" value="123456">
          <div class="error" id="err-pass">Şifre en az 6 karakter</div>
        </div>
        <button type="submit" class="btn" id="btn-login">Giriş Yap</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <div class="container">
      <div class="header">
        <div class="logo">🏥 KHHB-2 GÖREN ANALİZ</div>
        <div class="user-info">
          <span id="user-name">Kullanıcı</span>
          <button class="btn-sm" id="btn-logout">Çıkış</button>
        </div>
      </div>

      <div class="filters">
        <div class="filter-group">
          <label>Yıl</label>
          <select id="f-yil"><option value="2026">2026</option><option value="2025">2025</option></select>
        </div>
        <div class="filter-group">
          <label>Dönem</label>
          <select id="f-donem"><option value="1">Ocak</option><option value="2">Şubat</option><option value="3">Mart</option></select>
        </div>
        <div class="filter-group">
          <label>Kurum Türü</label>
          <select id="f-tur"><option value="Tümü">Tümü</option><option value="Hastane">Hastane</option><option value="ADSM">ADSM</option></select>
        </div>
        <button class="btn-query" id="btn-query">🔍 Sorgula</button>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">Toplam Kurum</div><div class="kpi-value" id="kpi-total">0</div></div>
        <div class="kpi-card"><div class="kpi-label">Hastane Ort.</div><div class="kpi-value" id="kpi-hosp">0.0</div></div>
        <div class="kpi-card"><div class="kpi-label">ADSM Ort.</div><div class="kpi-value" id="kpi-adsm">0.0</div></div>
      </div>

      <div class="table-section">
        <table>
          <thead><tr><th>Kurum</th><th>Tür</th><th>Puan</th><th>Rol Ort.</th><th>Durum</th></tr></thead>
          <tbody id="table-body"><tr><td colspan="5" style="text-align:center">Sorgulama yapınız...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const CONFIG = {
      URL: 'https://alisjxtoivkeyeyyuikr.supabase.co',
      KEY: 'sb_publishable_dToCJocokZ1QVw8-oHTe6Q_72u3p7Of'
    };

    const supabase = createClient(CONFIG.URL, CONFIG.KEY);
    let currentUser = null;

    // Toast
    function toast(msg, type = 'error') {
      document.querySelector('.toast')?.remove();
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      
      // Validasyon
      let valid = true;
      if (!email.includes('@')) { document.getElementById('err-email').classList.add('show'); valid = false; }
      else document.getElementById('err-email').classList.remove('show');
      
      if (pass.length < 6) { document.getElementById('err-pass').classList.add('show'); valid = false; }
      else document.getElementById('err-pass').classList.remove('show');
      
      if (!valid) return;
      
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor...';
      
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
        
        if (error) throw error;
        
        currentUser = data.user;
        
        // Profile bilgilerini çek
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        
        if (!profile) {
          toast('Profil bulunamadı', 'error');
          btn.disabled = false;
          btn.textContent = 'Giriş Yap';
          return;
        }
        
        // Dashboard'u göster
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('user-name').textContent = profile.ad_soyad || email;
        
        toast('Giriş başarılı!', 'success');
        
        // İlk yükleme
        loadData();
        
      } catch (err) {
        console.error('Login error:', err);
        toast(err.message || 'Giriş başarısız', 'error');
        btn.disabled = false;
        btn.textContent = 'Giriş Yap';
      }
    });

    // Logout
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      location.reload();
    });

    // Veri yükle
    document.getElementById('btn-query').addEventListener('click', loadData);

    async function loadData() {
      const btn = document.getElementById('btn-query');
      btn.textContent = '⏳ Yükleniyor...';
      
      try {
        const yil = document.getElementById('f-yil').value;
        const donem = document.getElementById('f-donem').value;
        const tur = document.getElementById('f-tur').value;
        
        let query = supabase.from('toplam_puanlar').select('*')
          .eq('yil', yil)
          .eq('donem', donem);
        
        if (tur !== 'Tümü') query = query.eq('kurum_tipi', tur);
        query = query.order('toplam_puan', { ascending: false }).limit(50);
        
        const { data, error } = await query;
        
        if (error) throw error;
        
        renderData(data || []);
        
      } catch (err) {
        console.error('Data error:', err);
        toast('Veri yüklenemedi', 'error');
        
        // Demo veri
        const demoData = [
          { kurum_adi: 'İstanbul Şehir Hastanesi', kurum_tipi: 'Hastane', toplam_puan: 94.2, rol_ortalamasi: 89.5, durum: 'Tamamlandı' },
          { kurum_adi: 'Ankara Merkez ADSM', kurum_tipi: 'ADSM', toplam_puan: 81.7, rol_ortalamasi: 78.3, durum: 'Beklemede' }
        ];
        renderData(demoData);
      } finally {
        btn.textContent = '🔍 Sorgula';
      }
    }

    function renderData(data) {
      // KPI
      const total = data.length;
      const hosp = data.filter(d => d.kurum_tipi === 'Hastane');
      const adsm = data.filter(d => d.kurum_tipi === 'ADSM');
      const avg = arr => arr.length ? (arr.reduce((s, d) => s + (d.toplam_puan || 0), 0) / arr.length).toFixed(1) : '0.0';
      
      document.getElementById('kpi-total').textContent = total;
      document.getElementById('kpi-hosp').textContent = avg(hosp);
      document.getElementById('kpi-adsm').textContent = avg(adsm);
      
      // Tablo
      const tbody = document.getElementById('table-body');
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Sonuç bulunamadı</td></tr>';
        return;
      }
      
      tbody.innerHTML = data.map(d => `
        <tr>
          <td><strong>${d.kurum_adi || '-'}</strong></td>
          <td>${d.kurum_tipi || '-'}</td>
          <td><strong>${d.toplam_puan?.toFixed(1) || '-'}</strong></td>
          <td>${d.rol_ortalamasi?.toFixed(1) || '-'}</td>
          <td><span class="status ${d.durum === 'Tamamlandı' ? 'status-tamam' : 'status-bekle'}">${d.durum || '-'}</span></td>
        </tr>
      `).join('');
    }

    // Session kontrolü
    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
        if (profile) {
          document.getElementById('login-screen').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          document.getElementById('user-name').textContent = profile.ad_soyad || session.user.email;
          loadData();
        }
      }
    }

    // Başlat
    checkSession();
  </script>
</body>
</html>
